# =========================
# APP
# =========================
quarkus.application.name=backoffice-service
quarkus.http.port=8084

# =========================
# DATABASE
# =========================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:backoffice_user}
quarkus.datasource.password=${DB_PASSWORD:backoffice_pass}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:astc-backoffice-postgres}:${DB_PORT:5432}/${DB_NAME:backoffice_db}

# =========================
# HIBERNATE
# =========================
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true

# =========================
# GRAPHQL
# =========================
quarkus.smallrye-graphql.ui.enable=true
quarkus.smallrye-graphql.root-path=/graphql
quarkus.smallrye-graphql.ui.always-include=true
# =========================
# JWT
# =========================
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://smms.auth.example.com}
quarkus.smallrye-jwt.enabled=true

# =========================
# SECURITY
# =========================
quarkus.http.auth.permission.public.paths=/graphql,/graphql/schema.graphql,/q/*
quarkus.http.auth.permission.public.policy=permit

# =========================
# CORS
# =========================
quarkus.http.cors=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3002,http://localhost:3000,http://localhost:3001
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# =========================
# MINIO / S3
# =========================
storage.bucket.name=document

# Configuración para quarkus-minio (recomendada)
quarkus.minio.url=http://minio:9000
quarkus.minio.access-key=${S3_ACCESS_KEY:minioadmin}
quarkus.minio.secret-key=${S3_SECRET_KEY:minioadmin}
quarkus.minio.bucket=document

# Configuración legacy S3 (si usas Amazon S3 extension)
quarkus.s3.endpoint-override=http://minio:9000
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY:minioadmin}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY:minioadmin}
quarkus.s3.path-style-access=true

# Forzar scanning de paquetes REST
quarkus.arc.scan-packages=com.backoffice.backoffice.infrastructure.controller.rest

# =========================
# DEV
# =========================
quarkus.devservices.enabled=false
quarkus.s3.devservices.enabled=false
quarkus.test.containers.enabled=false

# =========================
# RABBITMQ
# =========================
mp.messaging.outgoing.user-events.connector=smallrye-rabbitmq
mp.messaging.outgoing.user-events.host=${RABBITMQ_HOST:rabbitmq}
mp.messaging.outgoing.user-events.port=${RABBITMQ_PORT:5672}
mp.messaging.outgoing.user-events.username=${RABBITMQ_USER:guest}
mp.messaging.outgoing.user-events.password=${RABBITMQ_PASS:guest}
mp.messaging.outgoing.user-events.exchange.name=backoffice.exchange
mp.messaging.outgoing.user-events.routing-key=user.event