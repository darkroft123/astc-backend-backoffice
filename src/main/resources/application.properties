# =========================
# APP
# =========================
quarkus.application.name=backoffice-service

# =========================
# HTTP
# =========================
quarkus.http.port=8082

# =========================
# SECURITY
# =========================
quarkus.http.auth.proactive=true

# 🔐 SOLO endpoints REST seguros
quarkus.http.auth.permission.authenticated.paths=/rest/secure/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# 🌍 Público para Apollo Federation + endpoints internos
quarkus.http.auth.permission.public.paths=/graphql,/q/*
quarkus.http.auth.permission.public.policy=permit

# =========================
# JWT (RS256)
# =========================

quarkus.smallrye-jwt.enabled=true
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=better-auth-verify

quarkus.log.category."io.quarkus.security".level=INFO
quarkus.log.category."io.smallrye.jwt".level=INFO
quarkus.smallrye-graphql-client.auth-service.url=http://auth-service:8082/graphql
quarkus.smallrye-graphql-client.auth-service.log-payload=true
# =========================
# DATABASE (backoffice)
# =========================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:backoffice_user}
quarkus.datasource.password=${DB_PASSWORD:backoffice_password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:astc_backoffice}

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.packages=com.backoffice.backoffice.domain.entity,com.backoffice.shared.domain

# =========================
# DATABASE (notification - app database)
# =========================
quarkus.datasource."notification".db-kind=postgresql
quarkus.datasource."notification".username=${NOTIFICATION_DB_USERNAME:postgres}
quarkus.datasource."notification".password=${NOTIFICATION_DB_PASSWORD:postgres123}
quarkus.datasource."notification".jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${NOTIFICATION_DB_NAME:app}

quarkus.hibernate-orm."notification".datasource=notification
quarkus.hibernate-orm."notification".database.generation=none
quarkus.hibernate-orm."notification".log.sql=false
quarkus.hibernate-orm."notification".packages=com.backoffice.backoffice.domain.notification

# =========================
# GRAPHQL
# =========================
quarkus.smallrye-graphql.ui.enable=true
quarkus.smallrye-graphql.root-path=/graphql
quarkus.smallrye-graphql.ui.always-include=true
quarkus.smallrye-graphql.schema-include-directives=true
quarkus.smallrye-graphql.schema-include-schema-definition=true
quarkus.smallrye-graphql.federation.enabled=true

# =========================
# OPENTELEMETRY
# =========================
quarkus.otel.enabled=false

# =========================
# CORS
# =========================
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# =========================
# RABBITMQ
# =========================
quarkus.rabbitmq.devservices.enabled=false

mp.messaging.connector.smallrye-rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
mp.messaging.connector.smallrye-rabbitmq.port=${RABBITMQ_PORT:5672}
mp.messaging.connector.smallrye-rabbitmq.username=${RABBITMQ_USER:guest}
mp.messaging.connector.smallrye-rabbitmq.password=${RABBITMQ_PASS:guest}

mp.messaging.outgoing.notification-events.connector=smallrye-rabbitmq
mp.messaging.outgoing.notification-events.exchange.name=email.notification
mp.messaging.outgoing.notification-events.exchange.type=direct
mp.messaging.outgoing.notification-events.exchange.declare=true
mp.messaging.outgoing.notification-events.default-routing-key=email.notification

# =========================
# STORAGE (MINIO / S3)
# =========================

app.storage.endpoint=${S3_ENDPOINT:http://minio:9000}
app.storage.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9010}
app.storage.access-key=${S3_ACCESS_KEY:minioadmin}
app.storage.secret-key=${S3_SECRET_KEY:minioadmin}
app.storage.region=${S3_REGION:us-east-1}
app.storage.bucket=${S3_BUCKET:backoffice}

# Quarkus Amazon S3 properties required by S3Service
storage.bucket.name=${S3_BUCKET:backoffice}
storage.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9010}
quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY:minioadmin}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY:minioadmin}
quarkus.s3.endpoint-override=${S3_ENDPOINT:http://minio:9000}
quarkus.s3.aws.region=${S3_REGION:us-east-1}
# =========================u
# FLYWAY
# =========================

# =========================
# DEV / TEST
# =========================
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.test.containers.enabled=false
