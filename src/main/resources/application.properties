# =========================
# APP
# =========================
quarkus.application.name=backoffice-service
quarkus.http.port=8082

# =========================
# DATABASE
# =========================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgre
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/astc_db_backend_backoffice

# =========================
# HIBERNATE
# =========================
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true

# =========================
# GRAPHQL
# =========================
quarkus.smallrye-graphql.ui.enable=true
quarkus.smallrye-graphql.root-path=/graphql

# =========================
# JWT
# =========================
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=backoffice
quarkus.smallrye-jwt.enabled=true

# =========================
# SECURITY
# =========================
quarkus.http.auth.permission.public.paths=/graphql,/graphql/schema.graphql,/q/*
quarkus.http.auth.permission.public.policy=permit

# =========================
# S3 / MINIO (CORRECTO)
# =========================
quarkus.s3.endpoint-override=http://localhost:9000
quarkus.s3.aws.region=us-east-1

quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=backoffice-service
quarkus.s3.aws.credentials.static-provider.secret-access-key=backoffice123

quarkus.s3.path-style-access=true

# =========================
# DEV
# =========================
quarkus.devservices.enabled=false
quarkus.s3.devservices.enabled=false
quarkus.test.containers.enabled=false

# =========================
# RABBITMQ
# =========================
mp.messaging.outgoing.user-events.connector=smallrye-rabbitmq
mp.messaging.outgoing.user-events.host=localhost
mp.messaging.outgoing.user-events.port=5672
mp.messaging.outgoing.user-events.username=guest
mp.messaging.outgoing.user-events.password=guest
mp.messaging.outgoing.user-events.exchange.name=backoffice.exchange
mp.messaging.outgoing.user-events.routing-key=user.event