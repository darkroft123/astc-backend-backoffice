
# =========================
# APP
# =========================
quarkus.application.name=backoffice-service
quarkus.http.port=8080

# =========================
# DATABASE
# =========================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgre
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/backoffice

# =========================
# HIBERNATE
# =========================
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

%dev.quarkus.hibernate-orm.database.generation=drop-and-create

# =========================
# GRAPHQL
# =========================
quarkus.smallrye-graphql.ui.enable=true
quarkus.smallrye-graphql.root-path=/graphql

# =========================
# JWT
# =========================
mp.jwt.verify.publickey.location=classpath:publicKey.pem
mp.jwt.verify.issuer=https://backoffice.example.com
smallrye.jwt.sign.key.location=classpath:privateKey.pem
quarkus.smallrye-jwt.enabled=true

# =========================
# 🔐 SECURITY (CORRECTO PARA GRAPHQL)
# =========================

# PUBLICO: solo schema + UI + dev tools
quarkus.http.auth.permission.public.paths=/graphql,/graphql/schema.graphql,/q/*
quarkus.http.auth.permission.public.policy=permit

# PROTEGIDO: TODO GraphQL (la seguridad real va por @RolesAllowed)
quarkus.http.auth.permission.authenticated.paths=/graphql
quarkus.http.auth.permission.authenticated.policy=authenticated

# =========================
# S3
# =========================
quarkus.s3.endpoint-override=http://localhost:9000
quarkus.s3.aws.region=us-east-1

quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=backend-service
quarkus.s3.aws.credentials.static-provider.secret-access-key=backend123

quarkus.s3.path-style-access=true

# =========================
# DEV
# =========================
quarkus.devservices.enabled=false
quarkus.s3.devservices.enabled=false