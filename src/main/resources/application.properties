# =========================# APP# =========================quarkus.application.name=backoffice-service# =========================# HTTP# =========================quarkus.http.port=8082# =========================# SECURITY# =========================quarkus.http.auth.proactive=true# 🔐 SOLO endpoints REST segurosquarkus.http.auth.permission.authenticated.paths=/rest/secure/*quarkus.http.auth.permission.authenticated.policy=authenticated# 🌍 Público para Apollo Federation + endpoints internosquarkus.http.auth.permission.public.paths=/graphql,/q/*quarkus.http.auth.permission.public.policy=permit# =========================# JWT (RS256)# =========================quarkus.smallrye-jwt.enabled=truemp.jwt.verify.publickey.location=publicKey.pemmp.jwt.verify.issuer=better-auth-verifyquarkus.log.category."io.quarkus.security".level=INFOquarkus.log.category."io.smallrye.jwt".level=INFOquarkus.smallrye-graphql-client.auth-service.url=${AUTH_SERVICE_URL:http://astc-svc-auth-auth-service.astc-app.svc.cluster.local:8082/graphql}quarkus.smallrye-graphql-client.auth-service.log-payload=true# =========================# DATABASE (backoffice)# =========================quarkus.datasource.db-kind=postgresqlquarkus.datasource.username=${DB_USERNAME:backoffice_user}quarkus.datasource.password=${DB_PASSWORD:backoffice_password}quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:astc_backoffice}}quarkus.datasource.jdbc.max-size=${DB_POOL_SIZE:10}quarkus.datasource.jdbc.acquisition-timeout=${DB_ACQUISITION_TIMEOUT:60s}quarkus.hibernate-orm.schema-management.strategy=nonequarkus.hibernate-orm.log.sql=falsequarkus.hibernate-orm.log.bind-parameters=truequarkus.hibernate-orm.log.format-sql=truequarkus.hibernate-orm.packages=com.backoffice.backoffice.domain.entity,com.backoffice.shared.domainquarkus.hibernate-orm.database.version=16quarkus.hibernate-orm.jdbc.statement-batch-size=50# =========================# DATABASE (notification - app database)# =========================quarkus.datasource."notification".db-kind=postgresqlquarkus.datasource."notification".username=${NOTIFICATION_DB_USERNAME:backoffice_user}quarkus.datasource."notification".password=${NOTIFICATION_DB_PASSWORD:backoffice_password}quarkus.datasource."notification".jdbc.url=${NOTIFICATION_DB_JDBC_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${NOTIFICATION_DB_NAME:app}}quarkus.datasource."notification".jdbc.max-size=${DB_POOL_SIZE:10}quarkus.datasource."notification".jdbc.acquisition-timeout=${DB_ACQUISITION_TIMEOUT:60s}quarkus.hibernate-orm."notification".datasource=notificationquarkus.hibernate-orm."notification".database.generation=nonequarkus.hibernate-orm."notification".log.sql=falsequarkus.hibernate-orm."notification".log.bind-parameters=truequarkus.hibernate-orm."notification".log.format-sql=truequarkus.hibernate-orm."notification".packages=com.backoffice.backoffice.domain.notificationquarkus.hibernate-orm."notification".database.version=16# =========================# GRAPHQL# =========================quarkus.smallrye-graphql.ui.enable=truequarkus.smallrye-graphql.root-path=/graphqlquarkus.smallrye-graphql.ui.always-include=truequarkus.smallrye-graphql.schema-include-directives=truequarkus.smallrye-graphql.schema-include-schema-definition=truequarkus.smallrye-graphql.federation.enabled=true# =========================# OPENTELEMETRY# =========================quarkus.otel.enabled=false# =========================# VERTX (EVENT LOOP)# =========================quarkus.vertx.max-event-loop-execute-time=60s# =========================# CORS# =========================quarkus.http.cors.enabled=truequarkus.http.cors.origins=/.*/quarkus.http.cors.methods=GET,POST,OPTIONSquarkus.http.cors.headers=Content-Type,Authorization# =========================# RABBITMQ# =========================quarkus.rabbitmq.devservices.enabled=falsemp.messaging.connector.smallrye-rabbitmq.host=${RABBITMQ_HOST:rabbitmq}mp.messaging.connector.smallrye-rabbitmq.port=${RABBITMQ_PORT:5672}mp.messaging.connector.smallrye-rabbitmq.username=${RABBITMQ_USER:guest}mp.messaging.connector.smallrye-rabbitmq.password=${RABBITMQ_PASS:guest}mp.messaging.outgoing.notification-events.connector=smallrye-rabbitmqmp.messaging.outgoing.notification-events.exchange.name=email.notificationmp.messaging.outgoing.notification-events.exchange.type=directmp.messaging.outgoing.notification-events.exchange.declare=truemp.messaging.outgoing.notification-events.default-routing-key=email.notificationmp.messaging.outgoing.user-events.connector=smallrye-rabbitmqmp.messaging.outgoing.user-events.exchange.name=user-eventsmp.messaging.outgoing.user-events.exchange.type=fanoutmp.messaging.outgoing.user-events.exchange.declare=true# =========================# STORAGE (MINIO / S3)# =========================app.storage.endpoint=${S3_ENDPOINT:http://minio:9000}app.storage.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9010}app.storage.access-key=${S3_ACCESS_KEY:minioadmin}app.storage.secret-key=${S3_SECRET_KEY:minioadmin}app.storage.region=${S3_REGION:us-east-1}app.storage.bucket=${S3_BUCKET:backoffice}# Quarkus Amazon S3 properties required by S3Servicestorage.bucket.name=${S3_BUCKET:backoffice}storage.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9010}quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY:minioadmin}quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY:minioadmin}quarkus.s3.endpoint-override=${S3_ENDPOINT:http://minio:9000}quarkus.s3.aws.region=${S3_REGION:us-east-1}# =========================u# FLYWAY# =========================# =========================# DEV / TEST# =========================quarkus.devservices.enabled=falsequarkus.datasource.devservices.enabled=falsequarkus.test.containers.enabled=falsequarkus.http.cors.access-control-allow-credentials=truequarkus.log.category."io.smallrye.health".level=WARN