# =========================
# APP
# =========================
quarkus.application.name=backoffice-service

# =========================
# HTTP
# =========================
quarkus.http.port=8082

# =========================
# DATABASE
# =========================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:backoffice_user}
quarkus.datasource.password=${DB_PASSWORD:backoffice_password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:astc_backoffice}

# =========================
# HIBERNATE
# =========================
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true

# =========================
# GRAPHQL
# =========================
quarkus.smallrye-graphql.ui.enable=true
quarkus.smallrye-graphql.root-path=/graphql

# =========================
# JWT
# =========================
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://smms.auth.example.com}
quarkus.smallrye-jwt.enabled=true

# =========================
# CORS
# =========================
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# =========================
# STORAGE (MINIO / S3)
# =========================
storage.bucket.name=backoffice

quarkus.s3.endpoint-override=http://minio:9000
quarkus.s3.aws.region=us-east-1

quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY:minioadmin}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY:minioadmin}

quarkus.s3.path-style-access=true

# =========================
# DEV / TEST SETTINGS
# =========================
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.test.containers.enabled=false

# =========================
# HIBERNATE
# =========================
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true

# =========================
# FLYWAY
# =========================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration