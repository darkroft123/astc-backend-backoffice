# =========================
# APP
# =========================
quarkus.application.name=backoffice-service
quarkus.http.port=8084

# =========================
# DATABASE (LOCAL usando Docker DB)
# =========================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=backoffice_user
quarkus.datasource.password=backoffice_pass
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5436/backoffice_db

# =========================
# HIBERNATE
# =========================
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true

# =========================
# GRAPHQL
# =========================
quarkus.smallrye-graphql.ui.enable=true
quarkus.smallrye-graphql.root-path=/graphql
quarkus.smallrye-graphql.ui.always-include=true

# =========================
# JWT
# =========================
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://smms.auth.example.com
quarkus.smallrye-jwt.enabled=true

# =========================
# SECURITY
# =========================
quarkus.http.auth.permission.public.paths=/graphql,/graphql/schema.graphql,/q/*
quarkus.http.auth.permission.public.policy=permit

# =========================
# CORS
# =========================
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:3001,http://localhost:3002
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# =========================
# STORAGE (S3 COMPATIBLE → MINIO LOCAL)
# =========================
storage.bucket.name=document

quarkus.s3.endpoint-override=http://localhost:9010
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=minioadmin
quarkus.s3.aws.credentials.static-provider.secret-access-key=minioadmin
quarkus.s3.path-style-access=true

# =========================
# REST SCAN
# =========================
quarkus.arc.scan-packages=com.backoffice.backoffice.infrastructure.controller.rest

# =========================
# DEV
# =========================
quarkus.devservices.enabled=false
quarkus.s3.devservices.enabled=false
quarkus.test.containers.enabled=false

# =========================
# RABBITMQ (LOCAL → Docker)
# =========================
mp.messaging.outgoing.user-events.connector=smallrye-rabbitmq
mp.messaging.outgoing.user-events.host=localhost
mp.messaging.outgoing.user-events.port=5674
mp.messaging.outgoing.user-events.username=guest
mp.messaging.outgoing.user-events.password=guest
mp.messaging.outgoing.user-events.exchange.name=backoffice.exchange
mp.messaging.outgoing.user-events.routing-key=user.event